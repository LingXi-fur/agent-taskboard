[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-taskboard"
version = "0.2.0"
description = "Hand off, scope-check, conflict-check, and review parallel AI coding agent tasks with git worktrees."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LingXi-fur" }]
keywords = ["ai-agents", "claude-code", "codex", "opencode", "git-worktree", "code-review", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/LingXi-fur/agent-taskboard"
Repository = "https://github.com/LingXi-fur/agent-taskboard"
Changelog = "https://github.com/LingXi-fur/agent-taskboard/blob/main/CHANGELOG.md"
Issues = "https://github.com/LingXi-fur/agent-taskboard/issues"

[project.scripts]
atb = "agent_taskboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
